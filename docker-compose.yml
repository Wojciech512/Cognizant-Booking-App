version: "3.9"

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    #    networks:
    #      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    #    networks:
    #      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    env_file: .env
    build:
      context: ./backend
      dockerfile: Dockerfile-backend
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
#    networks:
#      - backend-net

#  frontend:
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile-frontend
#    depends_on:
#      - backend
#    ports:
#      - "8080:80"
#    networks:
#      - backend-net

volumes:
  dbdata:
